<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel administrador | Clínica NutriDifs</title>
  <link rel="stylesheet" href="../CSS/app.css">
</head>
<body class="admin-body" data-admin-page>
  <aside class="admin-sidebar">
    <a class="brand" href="../HTML/index.html">Clínica NutriDifs</a>
    <p class="admin-sidebar-subtitle">Panel administrador</p>
    <nav>
      <a href="index.html" class="active">Inicio</a>
      <a href="productos.html">Productos</a>
    </nav>
    <p class="admin-sidebar-footer">
      Sesión: <span id="admin-session-name">—</span><br>
      <button type="button" data-profile-logout>Cerrar sesión</button>
    </p>
  </aside>
  <main class="admin-main">
    <span class="admin-eyebrow">PANEL ADMINISTRADOR</span>
    <h1>¡Hola Administrador!</h1>
    <p class="admin-lead">Gestiona el catálogo de productos de la clínica.</p>

    <div class="admin-stats">
      <article>
        <span>Productos en catálogo</span>
        <strong data-admin-product-count>0</strong>
      </article>
    </div>

    <section class="admin-quick-access">
      <h2>Accesos rápidos</h2>
      <div>
        <span>Productos</span>
        <span>
          <a class="btn-secondary" href="productos.html">Ver listado</a>
          <a class="btn-primary" href="formulario-producto.html">Nuevo producto</a>
        </span>
      </div>
    </section>
  </main>
  <script src="../JS/app.js" defer></script>
</body>
</html>
