<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto | Panel administrador</title>
  <link rel="stylesheet" href="../CSS/app.css">
</head>
<body class="admin-body" data-admin-page>
  <aside class="admin-sidebar">
    <a class="brand" href="../HTML/index.html">Clínica NutriDifs</a>
    <p class="admin-sidebar-subtitle">Panel administrador</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html" class="active">Productos</a>
    </nav>
    <p class="admin-sidebar-footer">
      Sesión: <span id="admin-session-name">—</span><br>
      <button type="button" data-profile-logout>Cerrar sesión</button>
    </p>
  </aside>
  <main class="admin-main">
    <span class="admin-eyebrow">CATÁLOGO</span>
    <h1>Nuevo / editar producto</h1>
    <p class="admin-lead">Si llegaste desde "Editar" en el listado, los datos del producto se cargan automáticamente.</p>

    <form class="admin-form" data-admin-product-form novalidate>
      <label>Código producto
        <input type="text" name="id" minlength="3" required placeholder="ME023">
      </label>
      <label>Nombre
        <input type="text" name="name" maxlength="100" required>
      </label>
      <label>Descripción (opcional)
        <textarea name="description" maxlength="500" rows="3"></textarea>
      </label>
      <label>Precio (CLP)
        <input type="number" name="price" min="0" step="1" required>
      </label>
      <label>Stock
        <input type="number" name="stock" min="0" step="1" required>
      </label>
      <label>Stock crítico (opcional)
        <input type="number" name="stockCritico" min="0" step="1" placeholder="Alerta cuando el stock sea igual o menor">
      </label>
      <label>Categoría
        <select name="category" required>
          <option value="">-- Selecciona la categoría --</option>
          <option>Antibióticos</option>
          <option>Antiparasitarios</option>
          <option>Antiinflamatorios</option>
          <option>Dermatología</option>
          <option>Digestivo</option>
          <option>Cardíaco</option>
          <option>Analgésicos</option>
          <option>Vacunas</option>
          <option>Suplementos</option>
        </select>
      </label>
      <label>Imagen (opcional)
        <input type="text" name="image" placeholder="img/nombre-archivo.jpg">
      </label>
      <button class="btn-primary" type="submit">Guardar producto</button>
      <a class="btn-secondary" href="productos.html">Cancelar</a>
    </form>
  </main>
  <script src="../JS/app.js" defer></script>
</body>
</html>
