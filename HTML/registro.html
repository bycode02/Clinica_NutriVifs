<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Clínica NutriDifs</title>
  <link rel="stylesheet" href="../CSS/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="index.html">Clínica NutriDifs</a>
    <span class="auth-eyebrow">NUEVO CLIENTE</span>
    <h1>Crear cuenta</h1>
    <p class="auth-description">Regístrate para gestionar tus datos y solicitar atención veterinaria.</p>
    <form id="standalone-register-form" class="auth-form" data-standalone-register>
      <label for="reg-standalone-name">Nombre completo</label>
      <input type="text" id="reg-standalone-name" name="name" required>
      <label for="reg-standalone-email">Correo electrónico</label>
      <input type="email" id="reg-standalone-email" name="email" data-allowed-email placeholder="usuario@gmail.com" required>
      <label for="reg-standalone-phone">Teléfono</label>
      <input type="tel" id="reg-standalone-phone" name="phone" placeholder="+56 9 1234 5678" required>
      <label for="reg-standalone-birth">Fecha de nacimiento</label>
      <!-- El calendario se limita a fechas que corresponden a personas mayores de edad. -->
      <input type="date" id="reg-standalone-birth" name="birthDate" data-adult-birth required>
      <label for="reg-standalone-pass">Contraseña</label>
      <input type="password" id="reg-standalone-pass" name="password" required>
      <button type="submit" class="btn-primary">Registrarme</button>
      <p id="standalone-register-message" class="profile-message" role="status"></p>
    </form>
    <nav class="auth-links" aria-label="Opciones de cuenta">
      <a href="login.html">Ya tengo una cuenta</a>
      <a href="index.html">Volver al inicio</a>
    </nav>
  </main>
  <script src="../JS/app.js" defer></script>
</body>
</html>
