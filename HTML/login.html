<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Clínica NutriDifs</title>
  <link rel="stylesheet" href="../CSS/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html">Clínica NutriDifs</a>
    <p class="auth-kicker">Acceso de clientes</p>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-subtitle">Ingresa para continuar con tus solicitudes y reservas.</p>
    <form id="standalone-login-form" class="auth-form" data-standalone-login data-login-form>
      <div class="auth-field">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" data-allowed-email autocomplete="email" required>
        <p id="email-error" class="auth-field-error" role="alert"></p>
      </div>
      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="password-error" class="auth-field-error" role="alert"></p>
      </div>
      <p id="standalone-login-message" class="auth-message" data-auth-message data-login-message aria-live="polite"></p>
      <button class="auth-button" type="submit">Ingresar</button>
    </form>
    <nav class="auth-links" aria-label="Opciones de acceso">
      <a href="registro.html">Crear una cuenta</a>
      <a href="index.html">Volver al inicio</a>
    </nav>
  </main>
  <script src="../JS/app.js" defer></script>
</body>
</html>
